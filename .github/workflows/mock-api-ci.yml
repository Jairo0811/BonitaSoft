name: Mock API CI

on:
  push:
    paths:
      - "demo/mock-api/**"
      - ".github/workflows/mock-api-ci.yml"
  pull_request:
    paths:
      - "demo/mock-api/**"
      - ".github/workflows/mock-api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/mock-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: demo/mock-api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
