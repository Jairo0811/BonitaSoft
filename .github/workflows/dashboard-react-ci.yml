name: Dashboard React CI

on:
  push:
    paths:
      - 'ui/dashboard-react/**'
      - 'ui/theme/**'
      - '.github/workflows/dashboard-react-ci.yml'
  pull_request:
    paths:
      - 'ui/dashboard-react/**'
      - 'ui/theme/**'
      - '.github/workflows/dashboard-react-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/dashboard-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/dashboard-react/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build dashboard
        run: npm run build
